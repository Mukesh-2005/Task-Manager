<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Task Manager</title>
  </head>

  <body>
    <header class="header">
      <h1>My Task Manager</h1>
      <nav class="nav">
        <a href="#home">Home</a>
        <a href="#tasks">Tasks</a>
        <a href="#about">About</a>
      </nav>
      <div class="profile">Admin</div>
    </header>

    <main id="home">
      <section class="add-task">
        <h2>Add a Task</h2>
        <div class="add-form">
          <input type="text" id="task-input" placeholder="What needs doing?">
          <button id="add-btn" class="btn-primary">Add task</button>
        </div>
      </section>

      <section class="tasks" id="tasks">
        <h2>Your Tasks</h2>

        <div class="stats">
          <div class="stat"><span id="stat-total">0</span> Total</div>
          <div class="stat"><span id="stat-pending">0</span> Pending</div>
          <div class="stat"><span id="stat-done">0</span> Completed</div>
        </div>

        <div class="toolbar">
          <input type="text" id="search-input" placeholder="Search tasks...">
          <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="done">Completed</button>
          </div>
        </div>

        <div id="task-list"></div>
      </section>

      <section class="about" id="about">
        <h2>About</h2>
        <p>A simple dashboard keeping track of what needs doing.</p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 My Task Manager. All rights reserved.</p>
    </footer>

    <a href="#home" class="to-top">↑ Top</a>

    <script src="app.js"></script>
  </body>
</html>
